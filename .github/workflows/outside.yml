# outside/ keeps its rules (the 15 Nov proposal bundle, BS18): pauses in one format, never deleted or rewritten,
# a global one cleared by the host only, and outside/PAUSE present exactly while a global pause is open.
# HB-139: a deletion is checked against every earlier version of outside/pauses.jsonl in the whole history, not
# against HEAD~1 alone, so an unparseable or missing previous file cannot hide one; an unparseable HEAD~1 file is
# itself a failure. tests/test_check_outside.py holds the two-step deletion and the missing-parent case.
# Row 41r4 (25 Nov 2026 update): scripts/security_input.py is the same bytes as bee-self-test's copy at its main, and
# row 41r2: every security key a reader here takes with field() has an empty-state fixture (none today).
# B-43r (25 Nov 2026 update, rank 71): every LEDGER row's body, read from GitHub, carries the disclosure
# ("AI agent (HivePunk #<n>, HivemindOS)") and no promotion; tests/test_check_outside.py holds a promo-word body and a
# body with no disclosure, both refused. It runs daily too, so a body edited on GitHub after it opened is read again.
# HB-071 E: every action is pinned to a commit SHA (Dependabot proposes new ones, .github/dependabot.yml).
# Reads the files, git history and the ledger rows' public bodies only; GH_TOKEN is read-only, for the API's rate limit.
name: outside
on:
  push:
    branches: [main]
    paths: ["outside/**", "scripts/check_outside.py", "scripts/security_input.py", "tests/test_check_outside.py", ".github/workflows/outside.yml", ".github/dependabot.yml"]
  workflow_dispatch:
  schedule:
    - cron: "50 7 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The check's own cases
        run: |
          set -eu
          python3 scripts/security_input.py --self-test
          python3 scripts/security_input.py --keys scripts tests/test_check_outside.py
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/${GITHUB_REPOSITORY_OWNER}/bee-self-test.git" "$RUNNER_TEMP/bee-self-test-copy"
          git -C "$RUNNER_TEMP/bee-self-test-copy" sparse-checkout set scripts
          python3 scripts/security_input.py --same-as "$RUNNER_TEMP/bee-self-test-copy/scripts/security_input.py"
          python3 -m unittest discover -s tests -p 'test_check_outside.py'
      - name: Each ledger row's body, read from GitHub (a row whose body cannot be read stops the run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_outside.py --fetch-bodies "$RUNNER_TEMP/bodies"
      - name: The rules, against the whole history of outside/pauses.jsonl, and every ledger row's body
        run: python3 scripts/check_outside.py --bodies "$RUNNER_TEMP/bodies"
