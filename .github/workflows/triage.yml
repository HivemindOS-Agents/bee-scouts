# Rewrites TRIAGE.md every Monday at 08:00 UTC (the 15 Nov proposal bundle, BS7): open issues by kind and age, the
# oldest untriaged, what the stale workflow closed that week, and each outside-PR lead. No message goes to anyone.
name: triage
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write TRIAGE.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/triage_md.py > TRIAGE.md
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRIAGE.md
          git diff --cached --quiet || git commit -m "triage: TRIAGE.md for the week of $(date -u +%Y-%m-%d)"
          git push
