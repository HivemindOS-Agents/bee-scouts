# Closes an issue nobody triaged in 14 days (the 15 Nov proposal bundle, BS6): labelled stale at 10 days, closed at 14,
# unless it carries triaged, accepted, rejected or outside-pr-candidate. Pull requests are left alone.
name: stale
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-issue-stale: 10
          days-before-issue-close: 4
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: triaged,accepted,rejected,outside-pr-candidate
          stale-issue-message: "No one has triaged this in 10 days. It closes in 4 more unless it is triaged."
          close-issue-message: "No one triaged this in 14 days. Closed so the tracker stays readable; reopen if HivemindOS wants to act on it."
          close-issue-reason: not_planned
          operations-per-run: 200
